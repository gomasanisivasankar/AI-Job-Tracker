[project]
name = "Job-tracker"
version = "0.1.0"
description = "Track my Job Applications"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.0",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
]

[tool.fastapi]
entrypoint="app.main:app"
